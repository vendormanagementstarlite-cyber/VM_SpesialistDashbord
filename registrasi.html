<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registrasi Mitra STARLITE</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e2a47;--ink2:#47617d;--mute:#7b8fa6;--line:#d8e2ec;--line2:#e9eff5;--bg:#eef4fa;--card:#fff;--blue:#0b5cad;--blue2:#0a4a8c;--sky:#e7f1fb;--ok:#0f8a5f;--okbg:#e6f6ef;--bad:#c2372c;--badbg:#fdeceb;--warn:#a56300;--warnbg:#fff4e0;--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260' viewBox='0 0 260 260'><g fill='none' stroke='%230b5cad' stroke-opacity='.10' stroke-width='1.2'><path d='M0 40 L70 80 L140 30 L260 90'/><path d='M70 80 L90 170 L190 150 L260 220'/><path d='M140 30 L190 150'/><path d='M90 170 L30 240 L0 220'/><path d='M190 150 L170 260'/></g><g fill='%230b5cad' fill-opacity='.18'><circle cx='70' cy='80' r='3.5'/><circle cx='140' cy='30' r='3'/><circle cx='90' cy='170' r='3.5'/><circle cx='190' cy='150' r='3.5'/></g></svg>") fixed}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 120px}
.hd{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 0 var(--line2)}
.hd img{height:58px;width:auto;flex:none}
.hd h1{margin:0;font-size:19px;line-height:1.25;font-weight:800;letter-spacing:-.01em}
.hd p{margin:3px 0 0;font-size:13px;color:var(--ink2)}
.rail{display:flex;gap:6px;margin:14px 0 12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;display:flex;align-items:center;gap:7px;padding:7px 12px 7px 7px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.rail button i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line2);font-style:normal;font-size:11.5px;font-weight:800;color:var(--ink2)}
.rail button.on{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px rgba(11,92,173,.10)}.rail button.on i{background:var(--blue);color:#fff}
.rail button.done i{background:var(--ok);color:#fff}.rail button.err{border-color:var(--bad);color:var(--bad)}.rail button.err i{background:var(--bad);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 8px}
.card h2{margin:0 0 2px;font-size:17px;font-weight:800}
.card .lead{margin:0 0 6px;font-size:13px;color:var(--ink2)}
.note{margin:10px 0 4px;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.f{margin:12px 0;min-width:0}.f.full{grid-column:1/-1}
.f>label.l{display:block;margin-bottom:5px;font-size:13px;font-weight:700}
.f>label.l b{color:var(--bad);margin-left:2px}
.f .h{margin-top:4px;font-size:12px;color:var(--mute)}
.f .e{margin-top:5px;font-size:12.5px;font-weight:600;color:var(--bad);display:none}.f.bad .e{display:block}
input[type=text],input[type=email],input[type=number],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfdff;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,92,173,.12);background:#fff}
.f.bad input,.f.bad textarea{border-color:var(--bad);background:#fffafa}
.f.good input,.f.good textarea{border-color:#9fd6bf}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:#fbfdff;font-size:13.5px;font-weight:600;color:var(--ink2)}
.pills button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chk{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfdff;cursor:pointer;font-size:13.5px;line-height:1.45}
.chk input{margin:2px 0 0;width:18px;height:18px;accent-color:var(--blue);flex:none}
.chk.on{border-color:#a9c9ea;background:var(--sky)}.f.bad .chk{border-color:var(--bad)}
.drop{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px dashed #b9cbdd;border-radius:10px;background:#f7fafd;color:var(--ink2);font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--sky)}.f.bad .drop{border-color:var(--bad)}
.drop svg{flex:none}.drop b{color:var(--blue)}
.files{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.fi{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;border:1px solid var(--line2);border-radius:9px;background:#fff;font-size:12.5px}
.fi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.fi .sz{color:var(--mute);flex:none}.fi .st{flex:none;font-weight:700}
.fi.up .st{color:var(--blue)}.fi.ok .st{color:var(--ok)}.fi.bad{border-color:#f3c3be;background:var(--badbg)}.fi.bad .st{color:var(--bad)}
.fi .bar{position:relative;height:3px;flex:0 0 60px;background:var(--line2);border-radius:3px;overflow:hidden}.fi .bar i{position:absolute;inset:0;width:30%;background:var(--blue);animation:ld 1.1s infinite ease-in-out}
@keyframes ld{0%{left:-30%}100%{left:100%}}
.fi .pg{position:relative;flex:0 0 74px;height:6px;background:var(--line2);border-radius:6px;overflow:hidden}.fi .pg i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3b82f6,var(--blue));border-radius:6px;transition:width .2s}
.fi .pg.wait i{width:40%!important;animation:ld 1s infinite ease-in-out}
.fi .pc{flex:none;min-width:34px;text-align:right;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.fi.ok .st{display:inline-flex;align-items:center;gap:4px}.fi.ok .st svg{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.fi.up{border-color:#c7dcf3;background:linear-gradient(90deg,#f4f9ff,#fff)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.lgl{display:flex;flex-direction:column;gap:10px;margin:6px 0 4px}
.lrow{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px;align-items:start;padding:12px;border:1px solid var(--line2);border-radius:12px;background:#fcfdff;transition:border-color .15s,background .15s}
.lrow.on{border-color:#cfe0f3;background:#f7fbff}
.lrow .f{margin:0}.lrow .chk{border:0;background:none;padding:2px 0;font-weight:600}.lrow .chk.on{background:none}
.lrow .f>label.l{font-size:12px;color:var(--ink2)}
.lhint{align-self:center;font-size:12.5px;color:var(--mute)}
@media (max-width:620px){.lrow{grid-template-columns:1fr;gap:8px}.lhint{display:none}}
.tip{display:flex;gap:8px;align-items:flex-start;margin:0 0 8px;padding:9px 11px;border-radius:10px;background:var(--sky);color:#16426f;font-size:12.5px;line-height:1.45}.tip svg{flex:none;margin-top:1px}
.segm{display:inline-flex;gap:3px;padding:3px;margin-bottom:8px;border-radius:11px;background:var(--line2)}
.segm button{padding:7px 12px;border:0;border-radius:8px;background:none;font-size:12.5px;font-weight:700;color:var(--ink2)}.segm button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(14,42,71,.15)}
.sig.up{display:grid;place-items:center;min-height:190px;padding:12px;cursor:pointer;border-style:dashed;border-color:#b9cbdd;background:#f7fafd}.sig.up:hover,.sig.up.over{border-color:var(--blue);background:var(--sky)}
.sig.up img{max-width:100%;max-height:220px;display:block}
.ph2{display:flex;align-items:center;gap:12px;color:var(--ink2);font-size:13.5px;text-align:left}.ph2 b{color:var(--blue)}.ph2 small{color:var(--mute);font-size:12px}
.warnbox{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;padding:11px 13px;border-radius:12px;background:var(--warnbg);color:#7a4a00;font-size:13px;line-height:1.45;border:1px solid #f3d9a6}
.warnbox svg{flex:none;margin-top:1px}
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(14,42,71,.45);backdrop-filter:blur(4px);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 30px 80px -20px rgba(14,42,71,.5);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.dlg h3{margin:0 0 4px;font-size:17px;font-weight:800}.dlg p{margin:0 0 10px;font-size:13px;color:var(--ink2)}
.sum{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:10px 0 14px;padding:12px;border-radius:12px;background:#f6f9fc;font-size:13px}.sum span{color:var(--mute)}.sum b{word-break:break-word}
.dlg .act{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.sendbox{text-align:center;padding:8px 4px}
.ring{width:86px;height:86px;margin:4px auto 12px;position:relative}
.ring svg{width:86px;height:86px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:7}.ring .bg{stroke:var(--line2)}.ring .fg{stroke:var(--blue);stroke-linecap:round;stroke-dasharray:226;stroke-dashoffset:226;transition:stroke-dashoffset .5s ease}
.ring .ic{position:absolute;inset:0;display:grid;place-items:center;color:var(--blue)}
.ring.ok .fg{stroke:var(--ok)}.ring.ok .ic{color:var(--ok)}
.ring .chk path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.steps{list-style:none;margin:6px auto 0;padding:0;max-width:300px;text-align:left}
.steps li{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px;color:var(--mute);transition:color .2s}
.steps li i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);font-style:normal;flex:none;transition:all .2s}
.steps li.now{color:var(--ink);font-weight:700}.steps li.now i{border-color:var(--blue);border-top-color:transparent;animation:sp .8s linear infinite}
.steps li.done{color:var(--ok)}.steps li.done i{border-color:var(--ok);background:var(--ok);color:#fff;font-size:11px}
.fi .x{flex:none;width:24px;height:24px;border:0;border-radius:6px;background:none;color:var(--mute);font-size:16px;line-height:1}.fi .x:hover{background:var(--line2);color:var(--bad)}
.sig{position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;touch-action:none;overflow:hidden}
.sig canvas{display:block;width:100%;height:190px;cursor:crosshair}
.sig .ph{position:absolute;inset:0;display:grid;place-items:center;color:#b8c6d4;font-size:14px;font-weight:600;pointer-events:none}
.sig .base{position:absolute;left:24px;right:24px;bottom:42px;border-bottom:1px dashed #cdd9e5;pointer-events:none}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--mute)}
.sigbar button{border:0;background:none;color:var(--blue);font-weight:700;font-size:12.5px;padding:4px 6px}
.state{margin:10px 0;font-size:12.5px;color:var(--mute);text-align:right}
.decl{margin:6px 0 12px;padding:12px 14px;border-left:3px solid var(--blue);background:var(--sky);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.6}
.bar2{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar2 .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
.prog{flex:1;min-width:0}.prog .t{font-size:12px;font-weight:700;color:var(--ink2)}.prog .tr{height:5px;margin-top:5px;background:var(--line2);border-radius:5px;overflow:hidden}.prog .tr i{display:block;height:100%;background:var(--blue);border-radius:5px;transition:width .3s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--ink)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible,.pills button:focus-visible,.rail button:focus-visible,.drop:focus-visible{outline:3px solid rgba(11,92,173,.35);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:9;max-width:92vw;padding:10px 14px;border-radius:10px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 30px rgba(14,42,71,.25)}
.done{text-align:center;padding:30px 18px;margin-top:14px}
.done .ic{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:var(--okbg);color:var(--ok)}
.done h2{font-size:21px;margin:0 0 6px}.done p{margin:6px auto;max-width:520px;color:var(--ink2);font-size:14px}
.no{display:inline-block;margin:10px 0 4px;padding:8px 14px;border-radius:10px;background:var(--sky);color:var(--blue);font-weight:800;font-size:17px;letter-spacing:.01em}
.cp{display:flex;gap:6px;max-width:560px;margin:14px auto 0}.cp input{flex:1;font-size:12.5px;background:#f6f9fc}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:14px}
@media (max-width:620px){.grid{grid-template-columns:1fr}.hd img{height:46px}.hd h1{font-size:17px}.card{padding:16px 14px 6px}.btn{padding:0 14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
